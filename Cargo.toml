[package]
name = "kg-core"
version = "0.1.0"
edition = "2021"
description = "Knowledge Graph Memory Engine - A Rust library for persistent LLM memory with 3-agent architecture"
authors = ["David <david@buildspark.com>"]
license = "MIT"
repository = "https://github.com/yourusername/kg-core"
documentation = "https://github.com/yourusername/kg-core"
readme = "README.md"
keywords = ["knowledge-graph", "llm", "memory", "ai", "rag"]
categories = ["artificial-intelligence", "data-structures", "algorithms"]

[features]
default = ["cli"]
cli = ["clap", "tokio/rt-multi-thread"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"], optional = true }
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
parking_lot = "0.12"
once_cell = "1.19"
directories = "5.0"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
regex = "1.10"

[dev-dependencies]
tempfile = "3.8"
mockall = "0.12"

[[bin]]
name = "kg-core"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "kg_core"
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
